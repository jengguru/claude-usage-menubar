name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app bundle
        run: UNIVERSAL=1 scripts/build-app.sh
      - uses: actions/upload-artifact@v5
        with:
          name: ClaudeMeter
          path: build/ClaudeMeter.zip
